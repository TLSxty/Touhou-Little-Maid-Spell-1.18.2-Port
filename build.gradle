buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'

// 工程属性（见 gradle.properties）
def mod_id = project.mod_id
def mc_version = project.minecraft_version
def fg_version = project.forge_version
def mod_version = project.mod_version

version = mod_version
group = 'com.github.yimeng261.maidspell'
archivesBaseName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    // 1.18.2 官方映射
    mappings channel: 'official', version: mc_version

    // 若需要访问受保护字段/方法，再启用此处
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    // 本地 libs 放置基础模组 jar（touhoulittlemaid-1.18.2-release-1.2.2.jar）
    flatDir { dirs 'libs' }
    mavenCentral()
}

dependencies {
    // 1.18.2 Forge
    minecraft "net.minecraftforge:forge:${mc_version}-${fg_version}"

    // 基础模组 1.18.2（本地 jar，全小写命名）
    implementation name: 'touhoulittlemaid-1.18.2-release-1.2.2'

    // 注：铁魔法(irons_spellbooks) / Goety / 其它兼容模组均不引入，
    //     本移植只做饰品与建筑，不启用任何魔法适配。
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // 源码与资源统一 UTF-8 无 BOM
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : 'DreamCat',
            'Specification-Version'   : mod_version,
            'Implementation-Title'    : mod_id,
            'Implementation-Version'  : mod_version,
            'Implementation-Vendor'   : 'DreamCat',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
